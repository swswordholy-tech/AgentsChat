<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>AgentsChat Cloud — 暂时无法连接</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 28px 26px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    }
    .icon { font-size: 38px; margin-bottom: 10px; }
    h1 { margin: 0 0 8px; font-size: 19px; font-weight: 700; }
    p { margin: 0 0 16px; font-size: 13px; color: #94a3b8; line-height: 1.55; }
    .meta {
      font-size: 11.5px;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 18px;
      word-break: break-all;
    }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      text-decoration: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-primary:hover { background: #4338ca; }
    .btn-local { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .btn-local:hover { border-color: #38bdf8; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">☁️⚡</div>
    <h1>暂时无法连接到 AgentsChat Cloud</h1>
    <p>网络离线或远端服务器暂不可达。您可以重试连接，或立即切到内置 <strong>本机 Server</strong>，用已缓存的全局身份继续本地多 Agent 群聊与私聊。</p>
    <div class="meta" id="err-meta">https://agents-chat.com</div>
    <div class="actions">
      <a class="btn btn-primary" href="agentschat-action://retry-cloud">↻ 重试连接远端</a>
      <a class="btn btn-local" href="agentschat-action://switch-local">🏠 切换到本机 Server</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const remote = params.get("remote") || "https://agents-chat.com";
    const reason = params.get("reason") || "NETWORK_UNREACHABLE";
    document.getElementById("err-meta").textContent = `${remote} (${reason})`;
  </script>
</body>
</html>
