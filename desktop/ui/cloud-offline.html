<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>AgentsChat Cloud — 暂时无法连接</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --border: #e6e7e9;
      --ink-0: #191919;
      --ink-1: #60646c;
      --ink-2: #8c9099;
      --green: #07c160;
      --green-hover: #06ad56;
      --recessed: #f7f8fa;
    }

    body.dark {
      --bg: #191919;
      --card: #242424;
      --border: #333333;
      --ink-0: #ededed;
      --ink-1: #a6a6a6;
      --ink-2: #7a7a7a;
      --recessed: #1a1a1a;
    }
    body.dark .icon-badge { background: #2e2e2e; color: #a6a6a6; }
    body.dark .btn-local { background: #2c2c2c; color: #ededed; border-color: #3d3d3d; }
    body.dark .btn-local:hover { background: #363636; }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink-0);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .card {
      max-width: 440px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 28px 28px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .icon-badge {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: 12px;
      background: #f2f4f7;
      color: #60646c;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-badge svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink-0);
    }

    p {
      margin: 0 auto 20px;
      max-width: 38ch;
      font-size: 13.5px;
      color: var(--ink-1);
      line-height: 1.65;
      text-wrap: balance;
    }
    p strong { color: var(--ink-0); font-weight: 600; }

    .meta {
      font-size: 12px;
      color: var(--ink-2);
      font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--recessed);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px 8px 12px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
    }
    .meta-text {
      word-break: break-all;
      flex: 1;
      min-width: 0;
    }
    .copy-diag-btn {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--ink-1);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Text", system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .copy-diag-btn:hover {
      color: var(--ink-0);
      border-color: var(--ink-2);
    }
    .copy-diag-btn.copied {
      color: var(--green);
      border-color: var(--green);
    }
    .btn-primary.retrying {
      opacity: 0.72;
      pointer-events: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a.btn {
      text-decoration: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    a.btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-primary {
      background: var(--green);
      color: #ffffff;
    }
    .btn-primary:hover { background: var(--green-hover); }

    .btn-local {
      background: #ffffff;
      color: var(--ink-0);
      border-color: #d8dade;
    }
    .btn-local:hover { background: #f2f3f5; }

    a.btn:focus-visible,
    button.auto-toggle:focus-visible,
    button.copy-diag-btn:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }

    .auto-row {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 12px;
      color: var(--ink-2);
    }
    .auto-toggle {
      border: none;
      background: transparent;
      color: var(--ink-1);
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 5px;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .auto-toggle:hover { color: var(--ink-0); }
    .kbd-hint {
      margin-top: 10px;
      font-size: 11px;
      color: var(--ink-2);
    }
    .kbd-hint kbd {
      font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--recessed);
      border: 1px solid var(--border);
      color: var(--ink-1);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M2 2l20 20" />
        <path d="M17.5 19H7a4.5 4.5 0 0 1-.4-8.98 5.5 5.5 0 0 1 1.65-3.42" />
        <path d="M11.1 5.08A5.5 5.5 0 0 1 17.3 8.5a3.75 3.75 0 0 1 2.9 6.13" />
      </svg>
    </div>
    <h1>暂时无法连接到 AgentsChat Cloud</h1>
    <p>网络离线或远端服务暂不可达。可立即重试连接，或切换到内置 <strong>本机 Server</strong> 继续多 Agent 群聊与私聊。</p>
    <div class="meta">
      <span class="meta-text" id="err-meta">https://agents-chat.com</span>
      <button type="button" class="copy-diag-btn" id="btn-copy-diag" title="复制连接诊断信息">复制诊断</button>
    </div>
    <div class="actions">
      <a class="btn btn-primary" id="btn-retry-cloud" href="agentschat-action://retry-cloud">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
        <span id="retry-label">重试连接远端</span>
      </a>
      <a class="btn btn-local" id="btn-switch-local" href="agentschat-action://switch-local">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" /></svg>
        切换到本机 Server
      </a>
    </div>
    <div class="auto-row" role="status" aria-live="polite">
      <span id="auto-retry-status">将在 10 秒后自动重试 · 网络恢复时立即重连</span>
      <button type="button" class="auto-toggle" id="btn-toggle-auto">暂停</button>
    </div>
    <div class="kbd-hint">快捷键：<kbd>Enter</kbd> / <kbd>R</kbd> 立即重试 · <kbd>P</kbd> 暂停/继续 · <kbd>L</kbd> 切换本机 Server</div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const isDarkTheme = params.get("theme") === "dark";
    document.body.classList.toggle("dark", isDarkTheme);
    document.documentElement.style.colorScheme = isDarkTheme ? "dark" : "light";
    const remote = params.get("remote") || "https://agents-chat.com";
    const reason = params.get("reason") || "NETWORK_UNREACHABLE";
    const diagText = `${remote} (${reason})`;
    document.getElementById("err-meta").textContent = diagText;

    const retryLink = document.getElementById("btn-retry-cloud");
    const retryLabel = document.getElementById("retry-label");
    const localLink = document.getElementById("btn-switch-local");
    const autoStatus = document.getElementById("auto-retry-status");
    const toggleBtn = document.getElementById("btn-toggle-auto");
    const copyDiagBtn = document.getElementById("btn-copy-diag");

    let remaining = 10;
    let paused = false;
    let retrying = false;
    let copyResetTimer = null;
    let retryWatchdogTimer = null;

    function resetRetryState(statusMsg) {
      retrying = false;
      clearTimeout(retryWatchdogTimer);
      retryWatchdogTimer = null;
      if (retryLink) {
        retryLink.classList.remove("retrying");
        retryLink.removeAttribute("aria-disabled");
        retryLink.removeAttribute("aria-busy");
      }
      if (retryLabel) retryLabel.textContent = "重试连接远端";
      if (autoStatus && statusMsg) autoStatus.textContent = statusMsg;
    }

    function triggerRetry() {
      if (retrying) return;
      retrying = true;
      clearInterval(countdownTimer);
      if (retryLink) {
        retryLink.classList.add("retrying");
        retryLink.setAttribute("aria-disabled", "true");
        retryLink.setAttribute("aria-busy", "true");
      }
      if (retryLabel) retryLabel.textContent = "正在重连…";
      if (autoStatus) autoStatus.textContent = "正在重新连接 AgentsChat Cloud…";
      clearTimeout(retryWatchdogTimer);
      retryWatchdogTimer = setTimeout(() => {
        resetRetryState("重连超时 · 请按 Enter / R 再次重试或切换本机 Server");
      }, 12000);
      window.location.href = "agentschat-action://retry-cloud";
    }

    function updateCountdownLabel() {
      if (!autoStatus || !toggleBtn) return;
      if (paused) {
        autoStatus.textContent = "自动重试已暂停 · 网络恢复时将自动重连";
        toggleBtn.textContent = "继续";
      } else {
        autoStatus.textContent = `将在 ${remaining} 秒后自动重试 · 网络恢复时立即重连`;
        toggleBtn.textContent = "暂停";
      }
    }

    function toggleAutoRetry() {
      if (retrying) return;
      paused = !paused;
      if (!paused && remaining <= 0) remaining = 10;
      updateCountdownLabel();
    }

    async function copyDiagnosticText() {
      let copied = false;
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          await navigator.clipboard.writeText(diagText);
          copied = true;
        }
      } catch {}
      if (!copied) {
        try {
          const ta = document.createElement("textarea");
          ta.value = diagText;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          copied = document.execCommand("copy");
          ta.remove();
        } catch {}
      }
      if (copyDiagBtn) {
        copyDiagBtn.textContent = copied ? "✓ 已复制" : "复制失败";
        copyDiagBtn.classList.toggle("copied", copied);
        copyDiagBtn.setAttribute("aria-label", copied ? "已复制连接诊断信息" : "复制连接诊断信息失败");
        clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(() => {
          copyDiagBtn.textContent = "复制诊断";
          copyDiagBtn.classList.remove("copied");
          copyDiagBtn.setAttribute("aria-label", "复制连接诊断信息");
        }, 1500);
      }
    }

    const countdownTimer = setInterval(() => {
      if (paused || retrying) return;
      remaining -= 1;
      if (remaining <= 0) {
        triggerRetry();
        return;
      }
      updateCountdownLabel();
    }, 1000);

    retryLink?.addEventListener("click", (ev) => {
      ev.preventDefault();
      triggerRetry();
    });

    toggleBtn?.addEventListener("click", toggleAutoRetry);
    copyDiagBtn?.addEventListener("click", () => { void copyDiagnosticText(); });

    window.addEventListener("online", () => {
      triggerRetry();
    });

    document.addEventListener("keydown", (ev) => {
      if (ev.isComposing || ev.keyCode === 229 || ev.metaKey || ev.ctrlKey || ev.altKey) return;
      if (ev.key === "Enter") {
        if (document.activeElement === copyDiagBtn || document.activeElement === toggleBtn || document.activeElement === localLink) {
          return;
        }
        ev.preventDefault();
        triggerRetry();
      } else if (ev.key === "r" || ev.key === "R") {
        ev.preventDefault();
        triggerRetry();
      } else if (ev.key === "p" || ev.key === "P") {
        ev.preventDefault();
        toggleAutoRetry();
      } else if (ev.key === "l" || ev.key === "L") {
        ev.preventDefault();
        localLink?.click();
      }
    });
  </script>
</body>
</html>
