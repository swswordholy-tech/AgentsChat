<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>AgentsChat Cloud — 暂时无法连接</title>
  <style>
    :root {
      --bg-canvas: #0c0d10;
      --bg-canvas: oklch(15% 0.004 255);
      --bg-surface: #13151a;
      --bg-surface: oklch(18.5% 0.005 255);
      --bg-recessed: #090a0d;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --ink-primary: #f1f3f6;
      --ink-secondary: #9aa2b2;
      --ink-muted: #6c7484;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-ring: #3b82f6;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }
    ::selection { background: rgba(59, 130, 246, 0.32); color: var(--ink-primary); }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-canvas);
      color: var(--ink-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .card {
      max-width: 440px;
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 32px 28px 28px;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 24px 64px rgba(0, 0, 0, 0.55);
    }

    .icon-badge {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-secondary);
    }
    .icon-badge svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--ink-primary);
    }

    p {
      margin: 0 auto 20px;
      max-width: 40ch;
      font-size: 13.5px;
      color: var(--ink-secondary);
      line-height: 1.65;
      text-wrap: balance;
    }
    p strong {
      color: var(--ink-primary);
      font-weight: 500;
    }

    .meta {
      font-size: 11.5px;
      color: var(--ink-muted);
      font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      background: var(--bg-recessed);
      border: 1px solid var(--border-hairline);
      border-radius: 9px;
      padding: 9px 12px;
      margin-bottom: 22px;
      word-break: break-all;
      text-align: left;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a.btn {
      text-decoration: none;
      border-radius: 9px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid transparent;
      transition: background-color 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out), transform 120ms var(--ease-out);
    }
    a.btn:active { transform: scale(0.98); }
    a.btn:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; }
    a.btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-local {
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink-primary);
      border-color: var(--border-subtle);
    }
    .btn-local:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M2 2l20 20" />
        <path d="M17.5 19H7a4.5 4.5 0 0 1-.4-8.98 5.5 5.5 0 0 1 1.65-3.42" />
        <path d="M11.1 5.08A5.5 5.5 0 0 1 17.3 8.5a3.75 3.75 0 0 1 2.9 6.13" />
      </svg>
    </div>
    <h1>暂时无法连接到 AgentsChat Cloud</h1>
    <p>网络离线或远端服务暂不可达。可立即重试连接，或切换到内置 <strong>本机 Server</strong>，用已缓存的全局身份继续本地多 Agent 协同。</p>
    <div class="meta" id="err-meta">https://agents-chat.com</div>
    <div class="actions">
      <a class="btn btn-primary" href="agentschat-action://retry-cloud">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
        重试连接远端
      </a>
      <a class="btn btn-local" href="agentschat-action://switch-local">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3" /><path d="m8.5 10 2.5 2.25-2.5 2.25" /><path d="M13 14.5h3" /></svg>
        切换到本机 Server
      </a>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const remote = params.get("remote") || "https://agents-chat.com";
    const reason = params.get("reason") || "NETWORK_UNREACHABLE";
    document.getElementById("err-meta").textContent = `${remote} (${reason})`;
  </script>
</body>
</html>
