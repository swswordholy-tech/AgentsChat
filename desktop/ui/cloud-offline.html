<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>AgentsChat Cloud — 暂时无法连接</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --border: #e6e7e9;
      --ink-0: #191919;
      --ink-1: #60646c;
      --ink-2: #8c9099;
      --green: #07c160;
      --green-hover: #06ad56;
      --recessed: #f7f8fa;
    }

    body.dark {
      --bg: #191919;
      --card: #242424;
      --border: #333333;
      --ink-0: #ededed;
      --ink-1: #a6a6a6;
      --ink-2: #7a7a7a;
      --recessed: #1a1a1a;
    }
    body.dark .icon-badge { background: #2e2e2e; color: #a6a6a6; }
    body.dark .btn-local { background: #2c2c2c; color: #ededed; border-color: #3d3d3d; }
    body.dark .btn-local:hover { background: #363636; }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink-0);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .card {
      max-width: 440px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 28px 28px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .icon-badge {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: 12px;
      background: #f2f4f7;
      color: #60646c;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-badge svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink-0);
    }

    p {
      margin: 0 auto 20px;
      max-width: 38ch;
      font-size: 13.5px;
      color: var(--ink-1);
      line-height: 1.65;
      text-wrap: balance;
    }
    p strong { color: var(--ink-0); font-weight: 600; }

    .meta {
      font-size: 12px;
      color: var(--ink-2);
      font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--recessed);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 22px;
      word-break: break-all;
      text-align: left;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a.btn {
      text-decoration: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    a.btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-primary {
      background: var(--green);
      color: #ffffff;
    }
    .btn-primary:hover { background: var(--green-hover); }

    .btn-local {
      background: #ffffff;
      color: var(--ink-0);
      border-color: #d8dade;
    }
    .btn-local:hover { background: #f2f3f5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M2 2l20 20" />
        <path d="M17.5 19H7a4.5 4.5 0 0 1-.4-8.98 5.5 5.5 0 0 1 1.65-3.42" />
        <path d="M11.1 5.08A5.5 5.5 0 0 1 17.3 8.5a3.75 3.75 0 0 1 2.9 6.13" />
      </svg>
    </div>
    <h1>暂时无法连接到 AgentsChat Cloud</h1>
    <p>网络离线或远端服务暂不可达。可立即重试连接，或切换到内置 <strong>本机 Server</strong> 继续多 Agent 群聊与私聊。</p>
    <div class="meta" id="err-meta">https://agents-chat.com</div>
    <div class="actions">
      <a class="btn btn-primary" href="agentschat-action://retry-cloud">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
        重试连接远端
      </a>
      <a class="btn btn-local" href="agentschat-action://switch-local">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" /></svg>
        切换到本机 Server
      </a>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("theme") === "dark") document.body.classList.add("dark");
    const remote = params.get("remote") || "https://agents-chat.com";
    const reason = params.get("reason") || "NETWORK_UNREACHABLE";
    document.getElementById("err-meta").textContent = `${remote} (${reason})`;
  </script>
</body>
</html>
