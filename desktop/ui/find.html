<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find in Page</title>
  <style>
    :root {
      --bg: #ffffff;
      --border: #d5d8df;
      --ink-0: #181a1f;
      --ink-1: #5a6070;
      --ink-2: #8c92a0;
      --hover: #eef0f4;
      --accent: #07c160;
      --accent-soft: rgba(7, 193, 96, 0.14);
      --danger: #dc2626;
      --sep: #e5e7ec;
    }
    body.dark {
      --bg: #262629;
      --border: #3d3d42;
      --ink-0: #f3f4f6;
      --ink-1: #b1b5be;
      --ink-2: #7e838e;
      --hover: #35353a;
      --accent: #07c160;
      --accent-soft: rgba(7, 193, 96, 0.22);
      --danger: #f87171;
      --sep: #3a3a3f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink-0);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .find-bar {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px 0 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
    }
    .find-icon {
      width: 14px;
      height: 14px;
      color: var(--ink-2);
      flex-shrink: 0;
    }
    .find-input {
      flex: 1;
      min-width: 0;
      height: 30px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--ink-0);
      font-size: 13px;
      padding: 0 4px;
      user-select: text;
    }
    .find-input::placeholder {
      color: var(--ink-2);
    }
    .find-count {
      font-size: 11.5px;
      font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      color: var(--ink-2);
      padding: 0 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .find-count.no-match {
      color: var(--danger);
      font-weight: 600;
    }
    .find-sep {
      width: 1px;
      height: 16px;
      background: var(--sep);
      margin: 0 2px;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--ink-1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 11.5px;
      font-weight: 600;
      transition: background-color 120ms ease, color 120ms ease;
    }
    .icon-btn:hover:not(:disabled) {
      background: var(--hover);
      color: var(--ink-0);
    }
    .icon-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .icon-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    .icon-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .icon-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (prefers-reduced-motion: reduce) {
      .icon-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="find-bar" role="search" aria-label="页内查找">
    <svg class="find-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
    <input type="text" class="find-input" id="find-input" placeholder="在当前页面查找…" aria-label="在当前页面查找" autocomplete="off" spellcheck="false" />
    <button type="button" class="icon-btn" id="btn-clear" title="清空查找词" aria-label="清空查找词" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="m15 9-6 6M9 9l6 6" /></svg>
    </button>
    <span class="find-count" id="find-count" role="status" aria-live="polite"></span>
    <button type="button" class="icon-btn" id="btn-case" title="区分大小写" aria-label="区分大小写" aria-pressed="false">Aa</button>
    <span class="find-sep" aria-hidden="true"></span>
    <button type="button" class="icon-btn" id="btn-prev" title="上一个匹配 (⇧Enter)" aria-label="上一个匹配" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6" /></svg>
    </button>
    <button type="button" class="icon-btn" id="btn-next" title="下一个匹配 (Enter)" aria-label="下一个匹配" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
    </button>
    <button type="button" class="icon-btn" id="btn-close" title="关闭查找 (Esc)" aria-label="关闭查找">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
    </button>
  </div>

  <script>
    const api = window.agentschatFind;
    const input = document.getElementById("find-input");
    const btnClear = document.getElementById("btn-clear");
    const countEl = document.getElementById("find-count");
    const btnCase = document.getElementById("btn-case");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const btnClose = document.getElementById("btn-close");

    let matchCase = false;
    let composing = false;

    function syncClearVisibility() {
      if (btnClear) {
        btnClear.hidden = !(input && input.value.length > 0);
      }
    }

    function syncCaseButton() {
      if (!btnCase) return;
      btnCase.classList.toggle("active", matchCase);
      btnCase.setAttribute("aria-pressed", String(matchCase));
    }

    function applyState(state) {
      if (!state) return;
      if (state.theme === "dark" || state.theme === "light") {
        const isDark = state.theme === "dark";
        document.body.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      }
      if (typeof state.matchCase === "boolean") {
        matchCase = state.matchCase;
        syncCaseButton();
      }
      syncClearVisibility();
      const hasQuery = Boolean(input && input.value.length > 0);
      const total = Number(state.matches || 0);
      const label = typeof state.counterText === "string" ? state.counterText : "";
      if (countEl) {
        countEl.textContent = hasQuery ? label : "";
        countEl.classList.toggle("no-match", hasQuery && total === 0 && label.length > 0);
      }
      const canStep = hasQuery && total > 0;
      if (btnPrev) btnPrev.disabled = !canStep;
      if (btnNext) btnNext.disabled = !canStep;
    }

    function runSearch() {
      syncClearVisibility();
      const q = input ? input.value : "";
      if (!q) {
        applyState({ matches: 0, counterText: "" });
      }
      void api?.search?.(q, { matchCase });
    }

    input?.addEventListener("compositionstart", () => {
      composing = true;
    });
    input?.addEventListener("compositionend", () => {
      composing = false;
      runSearch();
    });
    input?.addEventListener("input", () => {
      syncClearVisibility();
      if (composing) return;
      runSearch();
    });

    btnClear?.addEventListener("click", () => {
      if (input) {
        input.value = "";
        input.focus();
      }
      runSearch();
    });
    btnCase?.addEventListener("click", () => {
      matchCase = !matchCase;
      syncCaseButton();
      runSearch();
      input?.focus();
    });
    btnPrev?.addEventListener("click", () => {
      void api?.step?.(false);
      input?.focus();
    });
    btnNext?.addEventListener("click", () => {
      void api?.step?.(true);
      input?.focus();
    });
    btnClose?.addEventListener("click", () => void api?.close?.());

    document.addEventListener("keydown", (ev) => {
      if (composing || ev.isComposing || ev.keyCode === 229) return;
      const key = String(ev.key || "");
      const low = key.toLowerCase();
      if (key === "Escape") {
        ev.preventDefault();
        void api?.close?.();
        return;
      }
      if (key === "Enter" && document.activeElement === input) {
        ev.preventDefault();
        if (input && input.value.length > 0) {
          void api?.step?.(!ev.shiftKey);
        }
        return;
      }
      if (key === "F3" && !ev.metaKey && !ev.ctrlKey && !ev.altKey) {
        ev.preventDefault();
        if (input && input.value.length > 0) {
          void api?.step?.(!ev.shiftKey);
        }
        return;
      }
      if ((ev.metaKey || ev.ctrlKey) && !ev.altKey) {
        if (low === "f" && !ev.shiftKey) {
          ev.preventDefault();
          input?.focus();
          input?.select();
          return;
        }
        if (low === "g") {
          ev.preventDefault();
          if (input && input.value.length > 0) {
            void api?.step?.(!ev.shiftKey);
          }
          return;
        }
      }
    });

    window.addEventListener("dragover", (ev) => ev.preventDefault());
    window.addEventListener("drop", (ev) => ev.preventDefault());

    if (api) {
      api.onState(applyState);
      api.onFocus((payload) => {
        if (payload && typeof payload.seedQuery === "string" && input) {
          input.value = payload.seedQuery;
        }
        if (payload) {
          applyState({
            theme: payload.theme,
            matches: payload.matches ?? 0,
            counterText: payload.counterText ?? "",
            matchCase: payload.matchCase,
          });
        }
        if (input) {
          input.focus();
          input.select();
          if (input.value.length > 0 && payload?.alreadySearched !== true) {
            runSearch();
          }
        }
      });
    }
  </script>
</body>
</html>
