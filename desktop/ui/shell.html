<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>AgentsChat</title>
  <style>
    :root {
      --rail-bg: #e9eaec;
      --rail-border: #d8dadd;
      --btn-hover: rgba(0, 0, 0, 0.06);
      --btn-active: #ffffff;
      --btn-active-shadow: 0 1px 3px rgba(0, 0, 0, 0.09), 0 0 0 1px rgba(0, 0, 0, 0.05);
      --ink-primary: #191919;
      --ink-secondary: #60646c;
      --ink-muted: #8b9099;
      --wechat-green: #07c160;
      --wechat-green-hover: #06ad56;
      --wechat-green-soft: rgba(7, 193, 96, 0.14);
      --danger: #fa5151;
      --sep: rgba(0, 0, 0, 0.08);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.dark {
      --rail-bg: #232323;
      --rail-border: #2e2e2e;
      --btn-hover: rgba(255, 255, 255, 0.08);
      --btn-active: #323232;
      --btn-active-shadow: 0 1px 4px rgba(0, 0, 0, 0.32), 0 0 0 1px rgba(255, 255, 255, 0.06);
      --ink-primary: #ededed;
      --ink-secondary: #9c9c9c;
      --ink-muted: #727272;
      --wechat-green-soft: rgba(7, 193, 96, 0.18);
      --sep: rgba(255, 255, 255, 0.08);
    }
    body.dark .node-btn.active .node-lbl { color: #ffffff; }
    body.dark .node-btn.active .dot { box-shadow: 0 0 0 2px #323232; }
    body.dark .badge.live { color: #38d97c; }
    body.dark .lan-chip { color: #38d97c; }

    * { box-sizing: border-box; user-select: none; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--rail-bg);
      color: var(--ink-primary);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .rail {
      position: relative;
      width: 72px;
      height: 100vh;
      background: var(--rail-bg);
      border-right: 1px solid var(--rail-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0 16px;
      gap: 8px;
      overflow-y: auto;
      scrollbar-width: none;
      -webkit-app-region: drag;
    }
    .rail::-webkit-scrollbar { display: none; }
    .rail.mac { padding-top: 48px; }

    @media (max-height: 670px) {
      .rail { padding: 10px 0 10px; gap: 4px; }
      .rail.mac { padding-top: 40px; }
      .brand-avatar { width: 38px; height: 38px; margin-bottom: 2px; }
      .brand-avatar img { width: 38px; height: 38px; }
      .nav-group { gap: 3px; }
      .node-btn { height: 42px; }
      .node-btn.quick-node { height: 38px; }
      .footer-stack { gap: 3px; }
      .mini-btn { width: 32px; height: 30px; }
    }

    .rail-load-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms var(--ease);
    }
    .rail-load-bar.active { opacity: 1; }
    .rail-load-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 55%;
      background: linear-gradient(90deg, transparent, var(--wechat-green), transparent);
      animation: railLoadSlide 1.05s ease-in-out infinite;
    }
    @keyframes railLoadSlide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(240%); }
    }

    .brand-avatar {
      -webkit-app-region: no-drag;
      width: 44px;
      height: 44px;
      border-radius: 11px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      flex-shrink: 0;
      transition: transform 120ms var(--ease), opacity 140ms var(--ease);
    }
    .brand-avatar:hover { opacity: 0.92; }
    .brand-avatar:active { transform: scale(0.95); }
    .brand-avatar:focus-visible { outline: 2px solid var(--wechat-green); outline-offset: 2px; }
    .brand-avatar img {
      width: 44px;
      height: 44px;
      display: block;
      object-fit: contain;
      -webkit-user-drag: none;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .node-btn {
      -webkit-app-region: no-drag;
      position: relative;
      width: 50px;
      height: 48px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--ink-secondary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 0;
      transition: background-color 140ms var(--ease), color 140ms var(--ease), box-shadow 140ms var(--ease), transform 110ms var(--ease);
    }
    .node-btn.quick-node {
      height: 44px;
    }
    .node-btn.quick-node .node-svg {
      width: 19px;
      height: 19px;
    }
    .node-btn:hover {
      background: var(--btn-hover);
      color: var(--ink-primary);
    }
    .node-btn:active { transform: scale(0.96); }
    .node-btn:focus-visible { outline: 2px solid var(--wechat-green); outline-offset: 2px; }

    .node-btn.active {
      background: var(--btn-active);
      color: var(--wechat-green);
      box-shadow: var(--btn-active-shadow);
    }
    .node-btn.active .node-svg {
      stroke: var(--wechat-green);
    }

    .node-svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .node-lbl {
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
    }
    .node-btn.active .node-lbl {
      font-weight: 600;
      color: #191919;
    }

    .dot {
      position: absolute;
      right: 7px;
      top: 7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c0c4cc;
      box-shadow: 0 0 0 2px var(--rail-bg);
    }
    .node-btn.active .dot { box-shadow: 0 0 0 2px #ffffff; }
    .dot.live { background: var(--wechat-green); }

    .unread-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 17px;
      height: 17px;
      padding: 0 4.5px;
      border-radius: 999px;
      background: var(--danger);
      color: #ffffff;
      font-size: 10px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 17px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(250, 81, 81, 0.4);
    }

    .spacer { flex: 1; }

    .rail-sep {
      width: 28px;
      height: 1px;
      background: var(--sep);
      margin: 2px 0;
    }

    .footer-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .lan-chip {
      -webkit-app-region: no-drag;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--wechat-green-soft);
      color: #059e4e;
    }

    .badge {
      -webkit-app-region: no-drag;
      border: none;
      background: transparent;
      padding: 2px 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-muted);
      font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      transition: background-color 140ms var(--ease), color 140ms var(--ease);
    }
    .badge:hover {
      background: var(--btn-hover);
      color: var(--ink-primary);
    }
    .badge:focus-visible { outline: 2px solid var(--wechat-green); outline-offset: 1px; }
    .badge.live { color: #059e4e; }

    .zoom-chip {
      -webkit-app-region: no-drag;
      border: 1px solid var(--sep);
      background: var(--btn-active);
      color: var(--ink-secondary);
      padding: 1px 6px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 9.5px;
      font-weight: 600;
      font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      line-height: 15px;
      transition: background-color 140ms var(--ease), color 140ms var(--ease), border-color 140ms var(--ease);
    }
    .zoom-chip:hover {
      border-color: var(--wechat-green);
      color: var(--wechat-green);
    }
    .zoom-chip:focus-visible { outline: 2px solid var(--wechat-green); outline-offset: 1px; }

    .mini-btn {
      -webkit-app-region: no-drag;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--ink-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background-color 140ms var(--ease), color 140ms var(--ease), transform 110ms var(--ease);
    }
    .mini-btn:hover {
      background: var(--btn-hover);
      color: var(--ink-primary);
    }
    .mini-btn:active { transform: scale(0.95); }
    .mini-btn:focus-visible { outline: 2px solid var(--wechat-green); outline-offset: 2px; }
    .mini-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mini-btn.copied {
      color: #059e4e;
      background: var(--wechat-green-soft);
    }
    .mini-btn.pinned {
      color: var(--wechat-green);
      background: var(--wechat-green-soft);
    }
    .mini-btn.pinned:hover {
      color: var(--wechat-green-hover);
      background: var(--wechat-green-soft);
    }
    .mini-btn.muted {
      color: #d97706;
      background: rgba(217, 119, 6, 0.14);
    }
    body.dark .mini-btn.muted {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.14);
    }
    .mini-btn.power-on {
      color: var(--wechat-green);
    }
    .mini-btn.power-on:hover {
      color: var(--wechat-green-hover);
      background: var(--wechat-green-soft);
    }

    .history-row {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .history-btn {
      width: 20px;
      height: 22px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--ink-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background-color 140ms var(--ease), color 140ms var(--ease), opacity 140ms var(--ease);
    }
    .history-btn.spinning svg {
      animation: railSpin 0.85s linear infinite;
    }
    @keyframes railSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .history-btn:hover:not(:disabled) {
      background: var(--btn-hover);
      color: var(--ink-primary);
    }
    .history-btn:disabled {
      opacity: 0.32;
      cursor: default;
    }
    .history-btn:focus-visible { outline: 2px solid var(--wechat-green); outline-offset: 1px; }
    .history-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <aside class="rail" id="rail" aria-label="工作区切换">
    <div class="rail-load-bar" id="rail-load-bar" aria-hidden="true"></div>
    <button class="brand-avatar" id="btn-brand-home" type="button" title="AgentsChat Desktop — 返回云端大厅 (⌘1)" aria-label="返回云端大厅"><img src="../assets/icon.png" alt="AgentsChat" /></button>

    <nav class="nav-group">
      <button class="node-btn active" id="btn-cloud" type="button" title="AgentsChat Cloud (⌘1) — 云端多 Agent 协同、/loop 与 Bot 市场" aria-label="云端工作区">
        <svg class="node-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17.5 19H7a4.5 4.5 0 0 1-.4-8.98A5.5 5.5 0 0 1 17.3 8.5 3.75 3.75 0 0 1 17.5 19Z" />
        </svg>
        <span class="node-lbl">云端</span>
        <span class="unread-badge" id="cloud-unread-badge" hidden>0</span>
      </button>

      <button class="node-btn" id="btn-local" type="button" title="本机 Server (⌘2) — 本机低延迟多 Agent 群聊与私聊" aria-label="本机聊天">
        <svg class="node-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" />
        </svg>
        <span class="node-lbl">本机</span>
        <span class="dot" id="local-dot" aria-hidden="true"></span>
        <span class="unread-badge" id="local-unread-badge" hidden>0</span>
      </button>

      <div class="rail-sep" aria-hidden="true" style="margin: 2px 0;"></div>

      <button class="node-btn quick-node" id="btn-cloud-studio" type="button" title="Cloud Studio 算力工坊 (⌘3)" aria-label="Cloud Studio">
        <svg class="node-svg" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="3" />
          <rect x="9" y="9" width="6" height="6" rx="1" />
          <path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3" />
        </svg>
        <span class="node-lbl">算力</span>
      </button>

      <button class="node-btn quick-node" id="btn-cloud-okr" type="button" title="OKR 协同看板 (⌘4)" aria-label="OKR Board">
        <svg class="node-svg" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="5" />
          <circle cx="12" cy="12" r="1.5" />
        </svg>
        <span class="node-lbl">OKR</span>
      </button>

      <button class="node-btn quick-node" id="btn-cloud-market" type="button" title="Bot 租赁市场 (⌘5)" aria-label="Bot Market">
        <svg class="node-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9h18l-1.4 10.2A2 2 0 0 1 17.6 21H6.4a2 2 0 0 1-2-1.8L3 9Z" />
          <path d="M8 9V6a4 4 0 0 1 8 0v3" />
        </svg>
        <span class="node-lbl">市场</span>
      </button>
    </nav>

    <div class="spacer"></div>

    <div class="footer-stack">
      <div class="rail-sep" aria-hidden="true"></div>
      <span class="lan-chip" id="lan-chip" title="局域网接入已开启 (0.0.0.0)" hidden>LAN</span>
      <button class="zoom-chip" id="btn-zoom-reset" type="button" title="当前缩放比例 — 点击还原 100% (⌘0)" aria-label="还原 100% 缩放" hidden>100%</button>
      <button class="badge" id="local-port-badge" type="button" title="本机 Server 监听端口 — 点击切换到本机">:8787</button>
      <div class="history-row" id="cloud-history-row">
        <button class="history-btn" id="btn-cloud-back" type="button" title="返回上一页 (⌘[)" aria-label="返回上一页" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <button class="history-btn" id="btn-active-reload" type="button" title="刷新当前页面 (⌘R)" aria-label="刷新当前页面">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" />
          </svg>
        </button>
        <button class="history-btn" id="btn-cloud-forward" type="button" title="前进下一页 (⌘])" aria-label="前进下一页" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>
      <button class="mini-btn" id="btn-shell-screenshot" type="button" title="框选截图并直接粘贴到聊天框 (⌘⇧X)" aria-label="框选截图并粘贴到聊天框">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="6" cy="6" r="3" />
          <circle cx="6" cy="18" r="3" />
          <path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12" />
        </svg>
      </button>
      <button class="mini-btn" id="btn-shell-pin" type="button" title="置顶窗口 (⌘⇧T)" aria-label="切换窗口置顶" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 17v5" />
          <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1Z" />
        </svg>
      </button>
      <button class="mini-btn" id="btn-shell-mute" type="button" title="静音桌面通知 (⌘⇧M)" aria-label="切换桌面通知静音" aria-pressed="false">
        <svg id="icon-bell" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
        <svg id="icon-bell-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5" />
          <path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
          <path d="m2 2 20 20" />
        </svg>
      </button>
      <button class="mini-btn" id="btn-shell-theme" type="button" title="切换浅色 / 深色模式 (⌘⇧D)" aria-label="切换浅色深色模式">
        <svg id="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
        </svg>
        <svg id="icon-sun" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
      </button>
      <button class="mini-btn" id="btn-copy-url" type="button" title="复制本机 MCP 接入命令" aria-label="复制本机 MCP 命令">
        <svg id="icon-copy" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2.2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        <svg id="icon-check" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </button>
      <button class="mini-btn" id="btn-power" type="button" title="启动 / 停止内置本机 Server" aria-label="开关本机 Server">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v8" />
          <path d="M17.66 6.34a8 8 0 1 1-11.32 0" />
        </svg>
      </button>
    </div>
  </aside>

  <script>
    const api = window.agentschatShell;
    const rail = document.getElementById("rail");
    const railLoadBar = document.getElementById("rail-load-bar");
    const btnBrandHome = document.getElementById("btn-brand-home");
    const btnCloud = document.getElementById("btn-cloud");
    const cloudUnreadBadge = document.getElementById("cloud-unread-badge");
    const btnLocal = document.getElementById("btn-local");
    const btnCloudStudio = document.getElementById("btn-cloud-studio");
    const btnCloudOkr = document.getElementById("btn-cloud-okr");
    const btnCloudMarket = document.getElementById("btn-cloud-market");
    const cloudHistoryRow = document.getElementById("cloud-history-row");
    const btnCloudBack = document.getElementById("btn-cloud-back");
    const btnActiveReload = document.getElementById("btn-active-reload");
    const btnCloudForward = document.getElementById("btn-cloud-forward");
    const btnZoomReset = document.getElementById("btn-zoom-reset");
    const localDot = document.getElementById("local-dot");
    const localUnreadBadge = document.getElementById("local-unread-badge");
    const lanChip = document.getElementById("lan-chip");
    const portBadge = document.getElementById("local-port-badge");
    const btnCopyUrl = document.getElementById("btn-copy-url");
    const iconCopy = document.getElementById("icon-copy");
    const iconCheck = document.getElementById("icon-check");
    const btnShellTheme = document.getElementById("btn-shell-theme");
    const btnShellPin = document.getElementById("btn-shell-pin");
    const btnShellMute = document.getElementById("btn-shell-mute");
    const iconBell = document.getElementById("icon-bell");
    const iconBellOff = document.getElementById("icon-bell-off");
    const btnShellScreenshot = document.getElementById("btn-shell-screenshot");
    const iconMoon = document.getElementById("icon-moon");
    const iconSun = document.getElementById("icon-sun");
    const btnPower = document.getElementById("btn-power");

    let latestState = null;
    let copyTimer = null;

    function applyPlatformShortcuts(platform) {
      const isMac = platform === "darwin";
      const mod = isMac ? "⌘" : "Ctrl+";
      const modShift = isMac ? "⌘⇧" : "Ctrl+Shift+";
      if (btnBrandHome) btnBrandHome.title = `AgentsChat Desktop — 返回云端大厅 (${mod}1)`;
      if (btnCloud) btnCloud.title = `AgentsChat Cloud (${mod}1) — 云端多 Agent 协同、/loop 与 Bot 市场`;
      if (btnLocal) btnLocal.title = `本机 Server (${mod}2) — 本机低延迟多 Agent 群聊与私聊`;
      if (btnCloudStudio) btnCloudStudio.title = `Cloud Studio 算力工坊 (${mod}3)`;
      if (btnCloudOkr) btnCloudOkr.title = `OKR 协同看板 (${mod}4)`;
      if (btnCloudMarket) btnCloudMarket.title = `Bot 租赁市场 (${mod}5)`;
      if (btnCloudBack) btnCloudBack.title = `返回上一页 (${mod}[)`;
      if (btnActiveReload) btnActiveReload.title = `刷新当前页面 (${mod}R)`;
      if (btnCloudForward) btnCloudForward.title = `前进下一页 (${mod}])`;
      if (btnShellTheme) btnShellTheme.title = `切换浅色 / 深色模式 (${modShift}D)`;
      if (btnShellPin) {
        const pinned = Boolean(latestState?.settings?.alwaysOnTop);
        btnShellPin.title = pinned ? `取消窗口置顶 (${modShift}T)` : `置顶窗口 (${modShift}T)`;
      }
      if (btnShellMute) {
        const muted = Boolean(latestState?.settings?.notificationsMuted);
        btnShellMute.title = muted ? `恢复本机通知提醒 (${modShift}M)` : `静音本机通知提醒 (${modShift}M)`;
      }
      if (btnShellScreenshot) {
        btnShellScreenshot.hidden = !isMac;
        btnShellScreenshot.title = `框选截图并直接粘贴到聊天框 (${modShift}X)`;
      }
      return { mod, modShift };
    }

    function render(state) {
      if (!state) return;
      latestState = state;
      const isMac = state.platform === "darwin";
      const { mod, modShift } = applyPlatformShortcuts(state.platform);
      if (isMac) rail.classList.add("mac");
      const isDark = state.settings?.theme === "dark";
      document.body.classList.toggle("dark", isDark);
      const isPinned = state.settings?.alwaysOnTop === true;
      if (btnShellPin) {
        btnShellPin.classList.toggle("pinned", isPinned);
        btnShellPin.setAttribute("aria-pressed", String(isPinned));
        btnShellPin.title = isPinned ? `取消窗口置顶 (${modShift}T)` : `置顶窗口 (${modShift}T)`;
      }
      const isMuted = state.settings?.notificationsMuted === true;
      if (btnShellMute) {
        btnShellMute.classList.toggle("muted", isMuted);
        btnShellMute.setAttribute("aria-pressed", String(isMuted));
        btnShellMute.title = isMuted ? `恢复本机通知提醒 (${modShift}M)` : `静音本机通知提醒 (${modShift}M)`;
      }
      if (iconBell && iconBellOff) {
        iconBell.toggleAttribute("hidden", isMuted);
        iconBellOff.toggleAttribute("hidden", !isMuted);
      }
      if (iconMoon && iconSun) {
        iconMoon.toggleAttribute("hidden", isDark);
        iconSun.toggleAttribute("hidden", !isDark);
      }
      const active = state.settings?.activeWorkspace || "cloud";
      const section = state.cloudNav?.section || "lobby";
      const isCloudLobby = active === "cloud" && section !== "cloud-agents" && section !== "okr-board" && section !== "marketplace";
      const isCloudStudio = active === "cloud" && section === "cloud-agents";
      const isCloudOkr = active === "cloud" && section === "okr-board";
      const isCloudMarket = active === "cloud" && section === "marketplace";

      btnCloud.classList.toggle("active", isCloudLobby);
      btnLocal.classList.toggle("active", active === "local");
      btnCloudStudio?.classList.toggle("active", isCloudStudio);
      btnCloudOkr?.classList.toggle("active", isCloudOkr);
      btnCloudMarket?.classList.toggle("active", isCloudMarket);

      btnCloud.setAttribute("aria-pressed", String(isCloudLobby));
      btnLocal.setAttribute("aria-pressed", String(active === "local"));
      btnCloudStudio?.setAttribute("aria-pressed", String(isCloudStudio));
      btnCloudOkr?.setAttribute("aria-pressed", String(isCloudOkr));
      btnCloudMarket?.setAttribute("aria-pressed", String(isCloudMarket));

      const canGoBack = Boolean(active === "cloud" && state.cloudNav?.canGoBack);
      const canGoForward = Boolean(active === "cloud" && state.cloudNav?.canGoForward);
      const isCloudLoading = Boolean(active === "cloud" && state.cloudNav?.isLoading);
      if (btnCloudBack) {
        btnCloudBack.disabled = !canGoBack;
        btnCloudBack.hidden = active !== "cloud";
      }
      if (btnCloudForward) {
        btnCloudForward.disabled = !canGoForward;
        btnCloudForward.hidden = active !== "cloud";
      }
      if (btnActiveReload) {
        btnActiveReload.classList.toggle("spinning", isCloudLoading);
      }
      if (railLoadBar) {
        railLoadBar.classList.toggle("active", isCloudLoading);
      }

      const zoomPct = Math.round(Number(state.settings?.zoomFactor ?? 1) * 100);
      if (btnZoomReset) {
        const showZoom = Number.isFinite(zoomPct) && zoomPct > 0 && zoomPct !== 100;
        btnZoomReset.hidden = !showZoom;
        if (showZoom) {
          btnZoomReset.textContent = `${zoomPct}%`;
          btnZoomReset.title = `当前缩放 ${zoomPct}% — 点击还原 100% (${mod}0)`;
        }
      }

      const running = Boolean(state.localServer?.running);
      localDot.classList.toggle("live", running);
      const cloudUnread = Number(state.cloudUnreadCount || 0);
      if (cloudUnreadBadge) {
        cloudUnreadBadge.hidden = cloudUnread <= 0;
        cloudUnreadBadge.textContent = cloudUnread > 99 ? "99+" : String(cloudUnread);
      }
      const unread = Number(state.localUnreadCount || 0);
      localUnreadBadge.hidden = unread <= 0;
      localUnreadBadge.textContent = unread > 99 ? "99+" : String(unread);
      lanChip.hidden = !(running && state.settings?.allowLan);
      const localOnlineCount = Array.isArray(state.localServer?.connectedAgents)
        ? state.localServer.connectedAgents.length
        : 0;
      portBadge.textContent = running ? ":" + state.localServer.port : "OFF";
      portBadge.classList.toggle("live", running);
      portBadge.title = running
        ? `本机 Server 运行中 (${state.localServer.httpUrl} · ${localOnlineCount} 个 Agent 在线) — 点击切换到本机`
        : "本机 Server 已停止 — 点击切换到本机";
      btnCopyUrl.title = active === "cloud"
        ? `复制当前云端页面链接 (${modShift}C) · 右键在浏览器打开 (${modShift}O)`
        : "复制本机 MCP 接入命令";
      btnCopyUrl.setAttribute(
        "aria-label",
        active === "cloud" ? "复制当前云端页面链接" : "复制本机 MCP 命令",
      );
      btnPower.classList.toggle("power-on", running);
      btnPower.title = running
        ? `本机 Server 运行中 (${state.localServer.httpUrl}) — 点击停止`
        : "本机 Server 已停止 — 点击启动";
    }

    btnBrandHome?.addEventListener("click", () => {
      if (api?.navigateCloudRoute) api.navigateCloudRoute("lobby");
      else api?.switchWorkspace("cloud");
    });
    btnCloud.addEventListener("click", () => {
      if (api?.navigateCloudRoute) api.navigateCloudRoute("lobby");
      else api?.switchWorkspace("cloud");
    });
    btnLocal.addEventListener("click", () => api?.switchWorkspace("local"));
    portBadge?.addEventListener("click", () => api?.switchWorkspace("local"));
    btnZoomReset?.addEventListener("click", () => api?.resetZoom?.());
    btnCloudStudio?.addEventListener("click", () => api?.navigateCloudRoute?.("cloud-agents"));
    btnCloudOkr?.addEventListener("click", () => api?.navigateCloudRoute?.("okr-board"));
    btnCloudMarket?.addEventListener("click", () => api?.navigateCloudRoute?.("marketplace"));
    btnCloudBack?.addEventListener("click", () => api?.cloudHistory?.("back"));
    btnActiveReload?.addEventListener("click", () => api?.reloadActiveView?.());
    btnCloudForward?.addEventListener("click", () => api?.cloudHistory?.("forward"));
    btnShellTheme?.addEventListener("click", () => {
      const next = document.body.classList.contains("dark") ? "light" : "dark";
      const isDark = next === "dark";
      document.body.classList.toggle("dark", isDark);
      iconMoon?.toggleAttribute("hidden", isDark);
      iconSun?.toggleAttribute("hidden", !isDark);
      api?.setTheme?.(next);
    });
    btnShellScreenshot?.addEventListener("click", () => {
      api?.captureScreenshot?.();
    });
    btnShellPin?.addEventListener("click", () => {
      const next = !(latestState?.settings?.alwaysOnTop === true);
      btnShellPin.classList.toggle("pinned", next);
      btnShellPin.setAttribute("aria-pressed", String(next));
      api?.setAlwaysOnTop?.(next);
    });
    btnShellMute?.addEventListener("click", () => {
      const next = !(latestState?.settings?.notificationsMuted === true);
      btnShellMute.classList.toggle("muted", next);
      btnShellMute.setAttribute("aria-pressed", String(next));
      iconBell?.toggleAttribute("hidden", next);
      iconBellOff?.toggleAttribute("hidden", !next);
      api?.setNotificationsMuted?.(next);
    });
    btnPower.addEventListener("click", () => {
      const next = !(latestState?.settings?.localServerEnabled !== false);
      api?.toggleLocalServer(next);
    });
    btnCopyUrl.addEventListener("contextmenu", (ev) => {
      const isCloud = (latestState?.settings?.activeWorkspace || "cloud") === "cloud";
      if (!isCloud || !api?.openCurrentCloudInBrowser) return;
      ev.preventDefault();
      api.openCurrentCloudInBrowser();
    });
    btnCopyUrl.addEventListener("click", async (ev) => {
      const isCloud = (latestState?.settings?.activeWorkspace || "cloud") === "cloud";
      if (ev.shiftKey && isCloud && api?.openCurrentCloudInBrowser) {
        api.openCurrentCloudInBrowser();
        return;
      }
      let copied = false;
      if (isCloud && api?.copyCurrentCloudUrl) {
        const copiedUrl = await api.copyCurrentCloudUrl();
        copied = Boolean(copiedUrl);
      }
      if (!copied) {
        const url = latestState?.localServer?.httpUrl || "http://127.0.0.1:8787";
        await api?.copyText(`npx -y agentschat-mcp@latest --url ${url}`);
      }
      btnCopyUrl.classList.add("copied");
      iconCopy.toggleAttribute("hidden", true);
      iconCheck.toggleAttribute("hidden", false);
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => {
        btnCopyUrl.classList.remove("copied");
        iconCopy.toggleAttribute("hidden", false);
        iconCheck.toggleAttribute("hidden", true);
      }, 1400);
    });

    if (api) {
      api.getState().then(render);
      api.onStateChanged(render);
    }
  </script>
</body>
</html>
