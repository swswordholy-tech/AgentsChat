<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>AgentsChat</title>
  <style>
    :root {
      --bg-rail: #09090b;
      --bg-rail: oklch(13% 0.004 255);
      --bg-hover: #16181e;
      --bg-hover: oklch(20% 0.006 255);
      --bg-active: #1d222c;
      --bg-active: oklch(24% 0.012 255);
      --border-hairline: rgba(255, 255, 255, 0.075);
      --border-subtle: rgba(255, 255, 255, 0.11);
      --ink-primary: #f1f3f6;
      --ink-secondary: #98a0b0;
      --ink-muted: #666e7e;
      --accent: #3b82f6;
      --accent-ink: #60a5fa;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --live: #34d399;
      --live-soft: rgba(52, 211, 153, 0.14);
      --danger: #ef4444;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; user-select: none; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-rail);
      color: var(--ink-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    .rail {
      width: 72px;
      height: 100vh;
      background: var(--bg-rail);
      border-right: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0 14px;
      gap: 6px;
      -webkit-app-region: drag;
    }
    .rail.mac { padding-top: 46px; }

    .rail-sep {
      width: 28px;
      height: 1px;
      background: var(--border-hairline);
      margin: 4px 0 6px;
      flex-shrink: 0;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .node-btn {
      -webkit-app-region: no-drag;
      position: relative;
      width: 52px;
      height: 50px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-secondary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0;
      transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out), border-color 140ms var(--ease-out), transform 120ms var(--ease-out);
    }
    .node-btn::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 50%;
      width: 3px;
      height: 18px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
      transform: translateY(-50%) scaleY(0.35);
      opacity: 0;
      transition: opacity 160ms var(--ease-out), transform 180ms var(--ease-out);
    }
    .node-btn:hover {
      background: var(--bg-hover);
      color: var(--ink-primary);
    }
    .node-btn:active {
      transform: scale(0.96);
    }
    .node-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .node-btn.active {
      background: var(--bg-active);
      border-color: var(--border-subtle);
      color: var(--ink-primary);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 6px rgba(0, 0, 0, 0.28);
    }
    .node-btn.active::before {
      opacity: 1;
      transform: translateY(-50%) scaleY(1);
    }
    .node-btn.active .node-svg {
      color: var(--accent-ink);
    }

    .node-svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      transition: color 140ms var(--ease-out);
    }
    .node-lbl {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1;
    }
    .node-btn.active .node-lbl {
      font-weight: 600;
      color: var(--ink-primary);
    }

    .dot {
      position: absolute;
      right: 7px;
      top: 7px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink-muted);
      box-shadow: 0 0 0 2px var(--bg-rail);
      transition: background-color 180ms var(--ease-out);
    }
    .node-btn.active .dot {
      box-shadow: 0 0 0 2px var(--bg-active);
    }
    .dot.live {
      background: var(--live);
    }

    .unread-badge {
      position: absolute;
      top: 3px;
      right: 3px;
      min-width: 17px;
      height: 17px;
      padding: 0 4.5px;
      border-radius: 999px;
      background: var(--danger);
      color: #ffffff;
      font-size: 10px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 17px;
      text-align: center;
      box-shadow: 0 0 0 2px var(--bg-rail), 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .unread-badge[hidden] { display: none; }

    .spacer { flex: 1; }

    .footer-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .lan-chip {
      -webkit-app-region: no-drag;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--live-soft);
      color: var(--live);
      border: 1px solid rgba(52, 211, 153, 0.28);
    }
    .lan-chip[hidden] { display: none; }

    .badge {
      -webkit-app-region: no-drag;
      font-size: 10px;
      font-weight: 500;
      color: var(--ink-muted);
      font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      padding: 2px 5px;
      border-radius: 5px;
      transition: color 140ms var(--ease-out);
    }
    .badge.live {
      color: var(--ink-secondary);
    }

    .mini-btn {
      -webkit-app-region: no-drag;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out), border-color 140ms var(--ease-out), transform 120ms var(--ease-out);
    }
    .mini-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-hairline);
      color: var(--ink-primary);
    }
    .mini-btn:active {
      transform: scale(0.95);
    }
    .mini-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .mini-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mini-btn.copied {
      color: var(--live);
      background: var(--live-soft);
      border-color: rgba(52, 211, 153, 0.28);
    }
    .mini-btn.power-on {
      color: var(--live);
    }
    .mini-btn.power-on:hover {
      color: #6ee7b7;
      background: var(--live-soft);
      border-color: rgba(52, 211, 153, 0.24);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <aside class="rail" id="rail" aria-label="Workspace Switcher">
    <div class="rail-sep" aria-hidden="true"></div>

    <nav class="nav-group">
      <button class="node-btn active" id="btn-cloud" type="button" title="AgentsChat Cloud (⌘1) — Cloud Agents, /loop, OKR & Bot Market" aria-label="AgentsChat Cloud">
        <svg class="node-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17.5 19H7a4.5 4.5 0 0 1-.4-8.98A5.5 5.5 0 0 1 17.3 8.5 3.75 3.75 0 0 1 17.5 19Z" />
        </svg>
        <span class="node-lbl">Cloud</span>
      </button>

      <button class="node-btn" id="btn-local" type="button" title="Local Mini-Server (⌘2) — Local MCP Hub on 127.0.0.1" aria-label="Local Mini-Server">
        <svg class="node-svg" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="4.5" width="17" height="15" rx="3" />
          <path d="m8.5 10 2.5 2.25-2.5 2.25" />
          <path d="M13 14.5h3" />
        </svg>
        <span class="node-lbl">Local</span>
        <span class="dot" id="local-dot" aria-hidden="true"></span>
        <span class="unread-badge" id="local-unread-badge" hidden>0</span>
      </button>
    </nav>

    <div class="spacer"></div>

    <div class="footer-stack">
      <div class="rail-sep" aria-hidden="true"></div>
      <span class="lan-chip" id="lan-chip" title="LAN Access Enabled (0.0.0.0)" hidden>LAN</span>
      <span class="badge" id="local-port-badge" title="Local Server Port">:8787</span>
      <button class="mini-btn" id="btn-copy-url" type="button" title="Copy Local MCP Server Command" aria-label="Copy Local MCP Server Command">
        <svg id="icon-copy" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2.2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        <svg id="icon-check" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </button>
      <button class="mini-btn" id="btn-power" type="button" title="Start / Stop Embedded Local Server" aria-label="Toggle Local Server">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v8" />
          <path d="M17.66 6.34a8 8 0 1 1-11.32 0" />
        </svg>
      </button>
    </div>
  </aside>

  <script>
    const api = window.agentschatShell;
    const rail = document.getElementById("rail");
    const btnCloud = document.getElementById("btn-cloud");
    const btnLocal = document.getElementById("btn-local");
    const localDot = document.getElementById("local-dot");
    const localUnreadBadge = document.getElementById("local-unread-badge");
    const lanChip = document.getElementById("lan-chip");
    const portBadge = document.getElementById("local-port-badge");
    const btnCopyUrl = document.getElementById("btn-copy-url");
    const iconCopy = document.getElementById("icon-copy");
    const iconCheck = document.getElementById("icon-check");
    const btnPower = document.getElementById("btn-power");

    let latestState = null;
    let copyTimer = null;

    function render(state) {
      if (!state) return;
      latestState = state;
      if (state.platform === "darwin") rail.classList.add("mac");
      const active = state.settings?.activeWorkspace || "cloud";
      btnCloud.classList.toggle("active", active === "cloud");
      btnLocal.classList.toggle("active", active === "local");
      btnCloud.setAttribute("aria-pressed", String(active === "cloud"));
      btnLocal.setAttribute("aria-pressed", String(active === "local"));

      const running = Boolean(state.localServer?.running);
      localDot.classList.toggle("live", running);
      const unread = Number(state.localUnreadCount || 0);
      localUnreadBadge.hidden = unread <= 0;
      localUnreadBadge.textContent = unread > 99 ? "99+" : String(unread);
      lanChip.hidden = !(running && state.settings?.allowLan);
      portBadge.textContent = running ? ":" + state.localServer.port : "OFF";
      portBadge.classList.toggle("live", running);
      btnPower.classList.toggle("power-on", running);
      btnPower.title = running
        ? `Local Server running (${state.localServer.httpUrl}) — click to stop`
        : "Local Server stopped — click to start";
    }

    btnCloud.addEventListener("click", () => api?.switchWorkspace("cloud"));
    btnLocal.addEventListener("click", () => api?.switchWorkspace("local"));
    btnPower.addEventListener("click", () => {
      const next = !(latestState?.settings?.localServerEnabled !== false);
      api?.toggleLocalServer(next);
    });
    btnCopyUrl.addEventListener("click", async () => {
      const url = latestState?.localServer?.httpUrl || "http://127.0.0.1:8787";
      await api?.copyText(`npx -y agentschat-mcp@latest --url ${url}`);
      btnCopyUrl.classList.add("copied");
      iconCopy.hidden = true;
      iconCheck.hidden = false;
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => {
        btnCopyUrl.classList.remove("copied");
        iconCopy.hidden = false;
        iconCheck.hidden = true;
      }, 1400);
    });

    if (api) {
      api.getState().then(render);
      api.onStateChanged(render);
    }
  </script>
</body>
</html>
